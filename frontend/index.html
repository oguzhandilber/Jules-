<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarity - Video Caption Remover</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Clarity</h1>
        <p>Upload your video to remove captions.</p>
        <input type="file" id="videoFile" accept="video/*">
        <button id="uploadButton">Upload and Process</button>
        <p id="statusMessage"></p>
        <!-- Download link will be dynamically added here by script.js -->
    </div>

    <footer>
        <p>&copy; 2025 Clarity | <a href="privacy.html">Privacy Policy</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
